<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171E" />
      <stop offset="50%" stop-color="#0D0F12" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE082" />
      <stop offset="30%" stop-color="#E5C158" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#996515" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background Shape -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Gold Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.6"/>
  <rect x="28" y="28" width="456" height="456" rx="100" fill="url(#goldGlow)"/>

  <!-- Monarca Crown Vector -->
  <g filter="url(#shadow)" transform="translate(106, 120)">
    <!-- Crown Body -->
    <path d="M 150 0 L 195 90 L 300 40 L 255 190 L 45 190 L 0 40 L 105 90 Z" fill="url(#goldGrad)" stroke="#FFE89E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Crown Base Band -->
    <rect x="35" y="198" width="230" height="28" rx="8" fill="url(#goldGrad)" stroke="#FFE89E" stroke-width="2"/>
    
    <!-- Jewels on Band -->
    <circle cx="75" cy="212" r="5" fill="#0D0F12" />
    <circle cx="115" cy="212" r="6" fill="#0D0F12" />
    <circle cx="150" cy="212" r="7" fill="#0D0F12" />
    <circle cx="185" cy="212" r="6" fill="#0D0F12" />
    <circle cx="225" cy="212" r="5" fill="#0D0F12" />

    <!-- Crown Peak Jewels -->
    <circle cx="0" cy="40" r="10" fill="url(#goldGrad)" stroke="#FFF" stroke-width="2"/>
    <circle cx="150" cy="0" r="14" fill="url(#goldGrad)" stroke="#FFF" stroke-width="2.5"/>
    <circle cx="300" cy="40" r="10" fill="url(#goldGrad)" stroke="#FFF" stroke-width="2"/>
  </g>

  <!-- Typography Monarca -->
  <text x="256" y="415" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif, sans-serif" font-weight="900" font-size="38" letter-spacing="8" fill="url(#goldGrad)">MONARCA</text>
  <text x="256" y="445" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="16" letter-spacing="10" fill="#E5C158" opacity="0.85">BARBER STUDIO</text>
</svg>
